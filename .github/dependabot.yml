version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: monday
      time: "21:00"
      timezone: Europe/Amsterdam
    labels:
      - infrastructure


  - package-ecosystem: "docker"
    directories:
      - /postgis/
      - /oracle/
      - /sqlserver/
      - /geoserver/
      - /solr/
    schedule:
      interval: "weekly"
      day: monday
      time: "21:10"
      timezone: Europe/Amsterdam
    labels:
      - dependency
    ignore: # stay on Tomcat 11 and java 25 for now
      - dependency-name: "tomcat"
        versions:
          - ">= 12"
      - dependency-name: "maven"
        versions:
          - ">= 3-eclipse-temurin-26"


  - package-ecosystem: "docker-compose"
    directory: /
    schedule:
      interval: "weekly"
      day: monday
      time: "21:05"
      timezone: Europe/Amsterdam
    labels:
      - dependency


  - package-ecosystem: "maven"
    directory: /geoserver/maven
    schedule:
      interval: "weekly"
      day: monday
      time: "21:20"
      timezone: Europe/Amsterdam
    labels:
      - dependency

